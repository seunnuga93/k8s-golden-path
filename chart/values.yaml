replicaCount: 3

image:
  repository: nginxinc/nginx-unprivileged
  tag: "stable"
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 2

ingress:
  enabled: false
  className: nginx
  host: demo.example.com

service:
  type: ClusterIP
  port: 80
