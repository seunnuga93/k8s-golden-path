name: ci
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint chart/
      - name: Render templates
        run: helm template demo chart/ --values chart/values.yaml > /dev/null
