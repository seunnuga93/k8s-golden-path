apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seunnuga93/k8s-golden-path
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
